<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=380, height=600" />
    <title>Clipnest</title>
    <style>
      @import url('./popup.css');
    </style>
  </head>
  <body>
    <header class="popup-header">
      <h1>Clipnest</h1>
      <input id="search" type="search" placeholder="Search clips…" autocomplete="off" />
    </header>
    <main class="popup-main">
      <progress id="storage-usage" max="100" value="0" aria-label="Storage usage"></progress>
      <div id="loading" class="loading" hidden aria-busy="true">Loading…</motion.div>
      <p id="empty-state" class="empty-state" hidden>Copy something to get started</p>
      <p id="no-results" class="empty-state" hidden>No matches</p>
      <ul id="clip-list" aria-label="Clip list"></ul>
      <p id="error" hidden></p>
    </main>
    <footer class="popup-footer">
      <span id="clip-counter"></span>
      <span id="status-badge" class="tier-free">FREE</span>
    </footer>
    <div id="toast" hidden aria-live="polite">Copied</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
