<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clipnest Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 24px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin: 16px 0 8px;
        font-weight: 600;
      }
      input[type='password'],
      input[type='text'] {
        width: 100%;
        padding: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      nav {
        margin-bottom: 24px;
      }
      .api-key-guide {
        margin-top: 20px;
        padding: 12px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        font-size: 14px;
      }
      .api-key-guide ol {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      .api-key-guide a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <nav>
      <a id="tag-manager-link" href="tags.html">Tag manager</a>
      <a id="template-manager-link" href="templates.html">Template manager</a>
    </nav>
    <h1>Clipnest Settings</h1>
    <section>
      <label class="row">
        <input id="ai-enabled" type="checkbox" />
        AI 機能を有効化 (Premium のみ)
      </label>
      <label for="gemini-api-key">Gemini API key</label>
      <input id="gemini-api-key" type="password" autocomplete="off" placeholder="BYO API key" />
      <aside class="api-key-guide" aria-labelledby="api-key-guide-title">
        <h2 id="api-key-guide-title">BYO API key の取得手順</h2>
        <ol>
          <li>
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer"
              >Google AI Studio</a
            >
            を開く
          </li>
          <li>「Create API key」からキーを作成する</li>
          <li>表示されたキーを上の入力欄に貼り付け、フォーカスを外して保存する</li>
        </ol>
      </aside>
      <p>Monthly AI calls: <span id="ai-usage">0</span></p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
